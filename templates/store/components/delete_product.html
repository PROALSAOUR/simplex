{% load static %}

<dialog id='delete_product_dialog' > 
    <form id="delete_product_form" method="post" action="{% url 'store:delete_product' %}">
        {% csrf_token %}
        <input type="hidden" name="product_id" id="delete-product-id">

        <div class="logo-image">
            <img src=" {% static "images/d-long-logo.png" %} " alt="logo" width="120" height="80"  draggable="false">
        </div>

        <div class="dialog-content">
            <h3 class="dialog-title"> تحذير </h3>
            <p>هل انت متأكد من رغبتك بحذف المنتج: <span class="cancel" id="delete-product-name"></span> بشكل نهائي؟ </p>
        </div>

        <div class="dialog-actions">
            <button type="button" onclick="delete_product_dialog.close()">تراجع</button>
            <button class="remove-btn" type="submit"> حذف</button>
        </div>
        
    </form>
</dialog>

<script src="{% static "js/products/delete_product.js" %}"></script>
