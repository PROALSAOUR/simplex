{% load static %}

<dialog id='delete_item_dialog' > 
    <form id="delete_item_form" method="post" action="{% url 'store:delete_product' %}">
        {% csrf_token %}
        <input type="hidden" name="item_id" id="delete-item-id">

        <div class="dialog-content">
            <h3 class="dialog-title" > تحذير </h3>
            <p class="dialog-text" >هل انت متأكد من رغبتك بحذف المنتج: <span class="cancel" id="delete-item-name"></span> بشكل نهائي؟ </p>
            <div class="delete-warning">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>لن تتمكن من التراجع عن هذه العملية بعد تأكيد الإزالة.</span>
            </div>
        </div>

        <div class="dialog-actions">
            <button class="cancel-btn" type="button" onclick="delete_item_dialog.close()">تراجع</button>
            <button class="remove-btn" type="submit"> حذف</button>
        </div>
        
    </form>
</dialog>

<script src="{% static "js/delete_item.js" %}"></script>
