{% load static %}
<dialog id='logout' > 
    <form method="post" action="{% url 'accounts:log_out' %}">
        {% csrf_token %}

        <div class="logo-image">
            <img src="{% static "images/d-long-logo.png" %} " alt="logo" width="120" height="80"  draggable="false">
        </div>

        <div class="dialog-icon">
            <img src="{% static "images/locked.png" %}" alt="" width="150" height="150" >
        </div>

        <div class="dialog-content">
            <h3 class="dialog-title"> تحذير </h3>
            <p class="dialog-text">هل انت متأكد من رغبتك بتسجيل الخروج؟</p>
        </div>

        <div class="dialog-actions">
            <button type="button" onclick="logout.close()">تراجع</button>
            <button class="remove-btn" type="submit">تسجيل الخروج</button>
        </div>
        
    </form>
</dialog>
