{% load static %}

<dialog id='delete_item_dialog' > 
    <form id="delete_item_form" method="post" action="{% url 'admins:delete_city' %}">
        {% csrf_token %}
        <input type="hidden" name="item_id" id="delete-item-id">

        <div class="dialog-content">
            <h3 class="dialog-title cancel" > تحذير </h3>
            <p class="dialog-text" >هل انت متأكد من رغبتك بحذف المدينة: <span class="cancel" id="delete-item-name"></span> بشكل نهائي؟ </p>
        </div>

        <div class="dialog-actions">
            <button type="button" onclick="delete_item_dialog.close()">تراجع</button>
            <button class="remove-btn" type="submit"> حذف</button>
        </div>
        
    </form>
</dialog>

<script src="{% static "js/delete_item.js" %}"></script>
