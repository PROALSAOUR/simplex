{% load static %}

{% comment %} ديالوج حذف منتج من الطلب {% endcomment %}
<dialog id='delete_order_item_dialog' > 
    <form id="delete_order_items_form" method="POST" data-url="{% url 'orders:delete_order_item' 0 %}">
        {% csrf_token %}
        <input type="hidden" name="order_item_id" id="delete-order-item-id">

        <div class="dialog-content">
            <h3 class="dialog-title"> تحذير </h3>

            <p class="dialog-text">
                هل أنت متأكد من رغبتك في إزالة المنتج
                <strong id="delete-order-item-name" class="cancel"></strong>
                من الطلب؟
            </p>

            <div class="delete-warning">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>لن تتمكن من التراجع عن هذه العملية بعد تأكيد الإزالة.</span>
            </div>
        </div>

        <div class="dialog-actions">
            <button class="cancel-btn" type="button" onclick="delete_order_item_dialog.close()">تراجع</button>
            <button class="remove-btn" type="submit"> إزالة</button>
        </div>
        
    </form>
</dialog>
